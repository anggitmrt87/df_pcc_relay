name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  ANDROID_API: "24"

jobs:
  android-arm64:
    name: Android arm64 binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          test -d "$NDK" || { echo "Android NDK not found on this runner"; exit 1; }
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Build
        run: |
          mkdir -p out
          "$TC/aarch64-linux-android${ANDROID_API}-clang" \
            -std=gnu11 -O2 -Wall -Wextra -pthread -s \
            -o out/df_pcc_relay src/df_pcc_relay.c -ldl

      - name: Verify the ELF
        run: |
          "$TC/llvm-readelf" -h -d out/df_pcc_relay | grep -E 'Machine|Type|NEEDED|RPATH|RUNPATH'
          bad=$("$TC/llvm-readelf" -d out/df_pcc_relay | grep NEEDED | grep -vE 'libc\.so|libdl\.so|libm\.so' || true)
          if [ -n "$bad" ]; then echo "Unexpected dependencies:"; echo "$bad"; exit 1; fi
          "$TC/llvm-readelf" -d out/df_pcc_relay | grep -E 'RPATH|RUNPATH' && exit 1 || true

      - name: Package (same layout as the ROM tree)
        run: |
          mkdir -p dist/system/bin dist/system/etc/init
          install -m 0755 out/df_pcc_relay dist/system/bin/df_pcc_relay
          install -m 0644 init/df_pcc_relay.rc dist/system/etc/init/df_pcc_relay.rc
          (cd dist && zip -r ../df_pcc_relay-arm64.zip system)
          sha256sum out/df_pcc_relay df_pcc_relay-arm64.zip | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: df_pcc_relay-arm64
          path: |
            out/df_pcc_relay
            df_pcc_relay-arm64.zip
            SHA256SUMS

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: df_pcc_relay-arm64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/df_pcc_relay-arm64.zip
            release/out/df_pcc_relay
            release/SHA256SUMS
